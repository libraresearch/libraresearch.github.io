  <style>
  /* ==========================================================================
     Libra Research — single-screen cover.
     A slow flowing gradient (WebGL) in our oxblood/ember warmth on deep ink,
     behind a minimal statement. Static gradient fallback for reduced-motion.
     ========================================================================== */

  :root {
    --ink:      #14120d;
    --paper:    #f3efe6;
    --muted:    rgba(243, 239, 230, 0.56);
    --hair:     rgba(243, 239, 230, 0.16);
    --accent:   oklch(0.7 0.14 38);   /* warm ember/oxblood — for the small kicker only */

    --serif: "Spectral", Georgia, "Times New Roman", serif;
    --mono:  "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
    --gutter: 56px;
  }

  *, *::before, *::after { box-sizing: border-box; }
  html { -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }

  body {
    margin: 0;
    background: var(--ink);
    color: var(--paper);
    font-family: var(--serif);
    font-size: 17px;
    line-height: 1.6;
    font-feature-settings: "liga" 1, "kern" 1;
    -webkit-tap-highlight-color: transparent;
  }
  a { color: inherit; }
  h1, p { margin: 0; }

  @media (max-width: 720px) { :root { --gutter: 24px; } }

  .mono { font-family: var(--mono); }

  .skip {
    position: absolute; left: -9999px; top: 0; z-index: 50;
    font-family: var(--mono); font-size: 12px; letter-spacing: 0.1em;
    background: var(--paper); color: var(--ink); padding: 12px 20px;
  }
  .skip:focus { left: 0; }
  :focus-visible { outline: 2px solid var(--paper); outline-offset: 4px; }

  /* ---- flowing background ---- */

  .bg {
    position: fixed; inset: 0; z-index: -2; width: 100%; height: 100%;
    display: block;
    /* fallback / pre-paint: a static version of the same palette */
    background:
      radial-gradient(80% 70% at 72% 38%, rgba(150,58,40,0.42) 0%, rgba(150,58,40,0) 55%),
      radial-gradient(70% 60% at 88% 78%, rgba(120,40,32,0.40) 0%, rgba(120,40,32,0) 60%),
      radial-gradient(90% 80% at 18% 90%, rgba(70,26,26,0.45) 0%, rgba(70,26,26,0) 60%),
      var(--ink);
  }

  /* legibility lift on the left, where the statement sits */
  .cover::before {
    content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
    background: linear-gradient(100deg, rgba(20,18,13,0.64) 0%, rgba(20,18,13,0.24) 40%, rgba(20,18,13,0) 68%);
  }

  /* ---- cover shell ---- */

  .cover {
    position: relative;
    min-height: 100vh; min-height: 100svh;
    display: flex; flex-direction: column;
    padding: clamp(22px, 4vh, 40px) var(--gutter);
    overflow: hidden;
  }

  .cover-top { display: flex; align-items: center; justify-content: space-between; gap: 18px; }
  .brand { display: flex; align-items: center; gap: 13px; text-decoration: none; }
  .brand .mk { width: 32px; height: 32px; display: block; color: var(--paper); }
  .brand .words { display: flex; flex-direction: column; }
  .brand .nm { font-family: var(--serif); font-weight: 600; font-size: 19px; line-height: 1; letter-spacing: -0.01em; }
  .brand .ds { font-family: var(--mono); font-size: 8px; font-weight: 500; letter-spacing: 0.36em; text-transform: uppercase; color: var(--muted); margin-top: 4px; }
  .cover-loc { font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.24em; text-transform: uppercase; color: var(--muted); }

  .cover-center { flex: 1; display: flex; flex-direction: column; justify-content: center; padding: 48px 0; }
  .kicker {
    font-family: var(--mono); font-size: 11px; font-weight: 500; letter-spacing: 0.32em;
    text-transform: uppercase; color: var(--accent); display: block; margin-bottom: 28px;
  }
  .cover-center h1 {
    font-family: var(--serif); font-weight: 600;
    font-size: clamp(44px, 7.4vw, 92px); line-height: 1.0; letter-spacing: -0.022em;
    margin-left: -0.02em; max-width: 15ch;
  }
  .cover-line {
    font-size: clamp(16.5px, 1.7vw, 20px); line-height: 1.55; color: rgba(243,239,230,0.84);
    max-width: 44ch; margin-top: 26px;
  }
  .cover-cta { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 40px; }

  .btn {
    font-family: var(--mono); font-size: 11px; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase;
    text-decoration: none; display: inline-flex; align-items: center; gap: 10px; padding: 16px 28px;
    transition: opacity 0.15s, background 0.15s, color 0.15s, border-color 0.15s;
  }
  .btn-primary { background: var(--paper); color: var(--ink); border: 1px solid var(--paper); }
  .btn-primary:hover { opacity: 0.88; }
  .btn-ghost { background: transparent; color: var(--paper); border: 1px solid var(--hair); }
  .btn-ghost:hover { border-color: rgba(243,239,230,0.5); }

  .cover-foot {
    display: flex; flex-wrap: wrap; gap: 8px 28px; align-items: center;
    font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted);
    padding-top: 18px; border-top: 1px solid var(--hair);
  }
  .cover-foot a { text-decoration: none; transition: color 0.15s; }
  .cover-foot a:hover { color: var(--paper); }
  .cover-foot .spacer { flex: 1; }
  @media (max-width: 560px) { .cover-foot .spacer { display: none; } .cover-foot { gap: 8px 18px; } }

<script>
  /* Footer year. */
  (function () {
    var y = document.getElementById('year');
    if (y) { y.textContent = String(new Date().getFullYear()); }
  })();

  /* ---- Flowing gradient background (WebGL) ----
     Domain-warped simplex noise mapped to the Libra warm palette. Slow + subtle.
     Falls back to the canvas's CSS gradient if WebGL is unavailable or the user
     prefers reduced motion. */
  (function () {
    var canvas = document.getElementById('bg');
    var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    var gl = null;
    try { gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl'); } catch (e) { gl = null; }
    if (!gl) { return; }            // CSS gradient on .bg remains as the backdrop
    canvas.style.background = 'none'; // hand over to the shader

    var vsrc = 'attribute vec2 a; void main(){ gl_Position = vec4(a,0.0,1.0); }';
    var fsrc = [
      'precision highp float;',
      'uniform vec2 u_res; uniform float u_time;',
      'vec3 mod289(vec3 x){return x-floor(x*(1.0/289.0))*289.0;}',
      'vec2 mod289(vec2 x){return x-floor(x*(1.0/289.0))*289.0;}',
      'vec3 permute(vec3 x){return mod289(((x*34.0)+1.0)*x);}',
      'float snoise(vec2 v){',
      '  const vec4 C=vec4(0.211324865405187,0.366025403784439,-0.577350269189626,0.024390243902439);',
      '  vec2 i=floor(v+dot(v,C.yy)); vec2 x0=v-i+dot(i,C.xx);',
      '  vec2 i1=(x0.x>x0.y)?vec2(1.0,0.0):vec2(0.0,1.0);',
      '  vec4 x12=x0.xyxy+C.xxzz; x12.xy-=i1; i=mod289(i);',
      '  vec3 p=permute(permute(i.y+vec3(0.0,i1.y,1.0))+i.x+vec3(0.0,i1.x,1.0));',
      '  vec3 m=max(0.5-vec3(dot(x0,x0),dot(x12.xy,x12.xy),dot(x12.zw,x12.zw)),0.0);',
      '  m=m*m; m=m*m;',
      '  vec3 x=2.0*fract(p*C.www)-1.0; vec3 h=abs(x)-0.5; vec3 ox=floor(x+0.5); vec3 a0=x-ox;',
      '  m*=1.79284291400159-0.85373472095314*(a0*a0+h*h);',
      '  vec3 g; g.x=a0.x*x0.x+h.x*x0.y; g.yz=a0.yz*x12.xz+h.yz*x12.yw;',
      '  return 130.0*dot(m,g);',
      '}',
      'float fbm(vec2 p){ float s=0.0,a=0.5; for(int i=0;i<4;i++){ s+=a*snoise(p); p*=2.0; a*=0.5; } return s; }',
      'void main(){',
      '  vec2 uv=gl_FragCoord.xy/u_res.xy;',
      '  vec2 p=vec2(uv.x*(u_res.x/u_res.y),uv.y);',
      '  float t=u_time*0.008;',
      '  vec2 q=vec2(fbm(p*0.4+vec2(0.0,t)),fbm(p*0.4+vec2(4.3,-t)));',
      '  float n=fbm(p*0.44+q*1.25+vec2(t*0.35,-t*0.2)); n=n*0.5+0.5;',
      '  vec3 ink=vec3(0.085,0.07,0.058);',
      '  vec3 maroon=vec3(0.30,0.11,0.10);',
      '  vec3 oxb=vec3(0.58,0.22,0.16);',
      '  vec3 ember=vec3(0.82,0.42,0.28);',
      '  vec3 sand=vec3(0.88,0.74,0.55);',
      '  vec3 col=ink;',
      '  col=mix(col,maroon,smoothstep(0.24,0.54,n));',
      '  col=mix(col,oxb,   smoothstep(0.48,0.74,n));',
      '  col=mix(col,ember, smoothstep(0.70,0.90,n));',
      '  col=mix(col,sand,  smoothstep(0.88,1.0,n)*0.50);',
      '  col=mix(ink,col,0.92);',
      '  float vig=smoothstep(1.35,0.15,length(uv-0.5)); col*=mix(0.70,1.0,vig);',
      '  gl_FragColor=vec4(col,1.0);',
      '}'
    ].join('\n');

    function sh(type, src) {
      var s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
      if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) { return null; }
      return s;
    }
    var vs = sh(gl.VERTEX_SHADER, vsrc), fs = sh(gl.FRAGMENT_SHADER, fsrc);
    if (!vs || !fs) { return; }
    var prog = gl.createProgram(); gl.attachShader(prog, vs); gl.attachShader(prog, fs); gl.linkProgram(prog);
    if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) { return; }
    gl.useProgram(prog);

    var buf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, buf);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
    var loc = gl.getAttribLocation(prog, 'a'); gl.enableVertexAttribArray(loc);
    gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
    var uRes = gl.getUniformLocation(prog, 'u_res'), uTime = gl.getUniformLocation(prog, 'u_time');

    function resize() {
      var dpr = Math.min(window.devicePixelRatio || 1, 1.5);
      var w = Math.floor(canvas.clientWidth * dpr), h = Math.floor(canvas.clientHeight * dpr);
      if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; gl.viewport(0, 0, w, h); }
    }
    window.addEventListener('resize', resize);

    var start = performance.now(), raf = null, running = false;
    function draw(now) {
      resize();
      gl.uniform2f(uRes, canvas.width, canvas.height);
      gl.uniform1f(uTime, (now - start) / 1000);
      gl.drawArrays(gl.TRIANGLES, 0, 3);
      if (running) { raf = requestAnimationFrame(draw); }
    }
    function play()  { if (!running && !reduce) { running = true; raf = requestAnimationFrame(draw); } }
    function pause() { running = false; if (raf) cancelAnimationFrame(raf); }

    resize();
    draw(performance.now());                 // paint one frame immediately (and the only frame if reduced-motion)
    if (!reduce) {
      play();
      document.addEventListener('visibilitychange', function () { document.hidden ? pause() : play(); });
    }
  })();
</script>
