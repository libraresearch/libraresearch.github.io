<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Libra Research</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#1b1a17">
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=Spectral:wght@600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #1b1a17;
      color: #f7f5f0;
      font-family: "Spectral", Georgia, serif;
      text-align: center;
      padding: 24px;
    }
    .mk { width: 96px; height: 96px; margin: 0 auto 36px; }
    h1 {
      font-weight: 600;
      font-size: clamp(40px, 8vw, 72px);
      line-height: 1;
      letter-spacing: -0.02em;
      margin: 0;
    }
    p {
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: rgba(247, 245, 240, 0.6);
      margin: 22px 0 40px;
    }
    a {
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #f7f5f0;
      text-decoration: none;
      border: 1px solid rgba(247, 245, 240, 0.25);
      padding: 14px 28px;
      transition: background 0.15s, color 0.15s;
    }
    a:hover { background: #f7f5f0; color: #1b1a17; }
  </style>
</head>
<body>
  <main>
    <svg class="mk" viewBox="0 0 100 100" aria-hidden="true">
      <!-- Signal mark, no finding: every dot open — nothing verified at this address -->
      <g fill="none" stroke="currentColor" stroke-width="1.16">
        <circle cx="16" cy="16" r="6.8"/><circle cx="38.67" cy="16" r="6.8"/><circle cx="61.33" cy="16" r="6.8"/><circle cx="84" cy="16" r="6.8"/>
        <circle cx="16" cy="38.67" r="6.8"/><circle cx="38.67" cy="38.67" r="6.8"/><circle cx="61.33" cy="38.67" r="6.8"/><circle cx="84" cy="38.67" r="6.8"/>
        <circle cx="16" cy="61.33" r="6.8"/><circle cx="38.67" cy="61.33" r="6.8"/><circle cx="61.33" cy="61.33" r="6.8"/><circle cx="84" cy="61.33" r="6.8"/>
        <circle cx="16" cy="84" r="6.8"/><circle cx="38.67" cy="84" r="6.8"/><circle cx="61.33" cy="84" r="6.8"/><circle cx="84" cy="84" r="6.8"/>
      </g>
    </svg>
    <h1>404</h1>
    <p>No finding at this address</p>
    <a href="/">Return home</a>
  </main>
</body>
</html>
